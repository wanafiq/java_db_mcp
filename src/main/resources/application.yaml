spring:
  main:
    banner-mode: off
    web-application-type: none
  profiles:
    active: ${DB_TYPE:mysql}
  ai:
    mcp:
      server:
        name: java-db-mcp
        version: 0.0.1
        stdio: true
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      keepalive-time: 300000
      max-lifetime: 1800000
      idle-timeout: 600000

mcp:
  pagination:
    max-rows: ${MAX_ROWS:500}
  db:
    type: ${DB_TYPE:mysql}
  sql:
    permissions:
      allow-insert: ${SQL_ALLOW_INSERT:false}
      allow-update: ${SQL_ALLOW_UPDATE:false}
      allow-delete: ${SQL_ALLOW_DELETE:false}
      allow-ddl: ${SQL_ALLOW_DDL:false}
  mongo:
    permissions:
      allow-write: ${MONGO_ALLOW_WRITE:false}
      allow-delete: ${MONGO_ALLOW_DELETE:false}
      allow-admin: ${MONGO_ALLOW_ADMIN:false}
  redis:
    permissions:
      allow-write: ${REDIS_ALLOW_WRITE:false}
      allow-admin: ${REDIS_ALLOW_ADMIN:false}
  es:
    permissions:
      allow-write: ${ES_ALLOW_WRITE:false}
      allow-delete: ${ES_ALLOW_DELETE:false}
      allow-admin: ${ES_ALLOW_ADMIN:false}

logging:
  file:
    name: ${LOG_FILE:${java.io.tmpdir}/java-db-mcp.log}
